agent:
  auto_approve: true
  max_iterations: 50
  timeout_seconds: 300

# Fast Mode - Bypass LLM planning for simple actions (15-30x speedup)
fast_mode:
  enabled: true
  verbose: false

# ─── Local Proxy Server ────────────────────────────────────────────────
# The proxy auto-launches on startup and routes LLM calls to your
# configured backend (Anthropic, OpenAI, Ollama, or custom).
# Set LLM_BACKEND env var to choose: anthropic / openai / ollama / custom
proxy:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  auto_start: true
  health_timeout: 15

llm:
  # LOCAL MODE — all traffic goes through the local proxy
  mode: local

  # Local proxy endpoint (auto-launched)
  local_url: http://127.0.0.1:8765
  base_url: http://127.0.0.1:8765

  # Remote URL (fallback if proxy is down)
  remote_url: https://api.z.ai/api/anthropic

  # MODEL CONFIGURATION — the proxy maps these to actual backend models.
  # e.g., "glm-5" → "claude-sonnet-4-20250514" (Anthropic) or "gpt-4o" (OpenAI)
  main_model: glm-5
  fast_model: glm-5
  tool_calling_model: glm-5
  vision_model: glm-5
  web_vision_model: glm-5
  complex_model: glm-5

  # Kimi API URL (via proxy)
  kimi_api_url: http://127.0.0.1:8765

# Strategic Planner Configuration
strategic_planner:
  enabled: true
  primary_llm: glm-5
  recovery_threshold: 2
  kimi_timeout_seconds: 120.0
  qwen_timeout_seconds: 120.0
  max_fallback_retries: 3
  max_total_retries: 5
  escalate_after_failures: 1

# HTN Planning
planning:
  enabled: true
  max_depth: 3
  use_templates: true
  checkpoint_interval: 5

# LLM Call Strategy
llm_strategy:
  first_call_model: glm-5
  execution_model: glm-5
  final_call_model: glm-5

  temperature: 0.1
  max_tokens: 4096
  timeout_ms: 60000

visual_targeting:
  enabled: true
  mode: auto
  model: glm-5

browser:
  headless_default: true
  use_persistent_context: true
  nav_timeout: 30000
  operation_timeout: 120000
  use_a11y_first: true

timing:
  loop_delay: 2
  nav_delay: 2
  click_delay: 0.5
  content_load_delay: 3

logging:
  level: INFO

# Dual-LLM Architecture
dual_llm:
  enabled: true
  orchestrator_model: glm-5
  executor_model: glm-5

# Worker Loop Settings
worker:
  max_steps: 20
  context_window: 8192
  max_tokens_planner: 512
  max_tokens_navigator: 256

# Web Daemon Settings
web_daemon:
  cache_ttl_seconds: 900
  rate_limit_per_domain: 10
  collectors:
    - simple_http
    - playwright
    - alt_frontend
  fallback_enabled: true

# Tool Wrapper Settings
tool_wrappers:
  max_retries: 3
  backoff_base: 2
  lock_threshold: 5

# Safety Defaults
safety:
  default_allowed_domains: []
  forbidden_actions:
    - delete_account
    - permanently_delete_data
    - unsubscribe_all
  destructive_confirmation: true

